[project]
name = "jupyter-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "bioio>=3.5.0",
    "bioio-czi>=2.9.1",
    "cellpose>=4.2.1.1",
    "cropper",
    "dinov3",
    "jupyterlab>=4.6.3",
    "kaleido>=1.4.0",
    "napari-animation>=0.0.10",
    "napari-czitools>=0.12.4",
    "napari-nikon-nd2",
    "napari-tiff>=0.1.6",
    "napari-vsi",
    "napari[all]>=0.9.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "slideio>=2.9.0",
    "statsmodels>=0.15.0",
    "sympy>=1.14.0",
    "trackpy>=0.7",
    "umap-learn>=0.5.12",
    "video-array",
]

# torch/torchvision live in extras rather than base deps so a launcher can pick
# the build: `uv sync --extra cpu` or `uv sync --extra cu130`. Selecting neither
# resolves torch from PyPI (cellpose pulls it in transitively regardless).
[project.optional-dependencies]
cpu = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]
cu130 = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[tool.uv]
# These extras can never be installed together. Declaring the conflict lets uv
# lock a separate resolution for each instead of erroring on the two torch
# indexes, so one uv.lock serves both the CPU and CUDA launchers.
conflicts = [
    [{ extra = "cpu" }, { extra = "cu130" }],
]

[tool.uv.sources]
napari-vsi = { git = "https://github.com/cwood1967/napari-vsi.git" }
cropper = { git = "https://github.com/cwood1967/napari-cropper.git" }
# The pytorch cpu index has no macOS wheels; let Darwin fall through to PyPI,
# which already ships the correct arm64 (MPS-enabled) build.
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130" },
]
dinov3 = { git = "https://github.com/facebookresearch/dinov3" }
video-array = { git = "https://github.com/cwood1967/video_array.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
